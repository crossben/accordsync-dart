name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *' # daily: catches a contract change in crossben/accordsync

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - name: accordsync_core
        run: dart test
        working-directory: packages/accordsync_core
      - name: accordsync
        run: dart test
        working-directory: packages/accordsync
      - name: accordsync_flutter
        run: flutter test
        working-directory: packages/accordsync_flutter

  # Mixed fleet: Dart and TypeScript clients against the real server (published npm packages).
  interop:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
          POSTGRES_DB: accord
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U accord" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: interop/run.sh
        env:
          ACCORD_DATABASE_URL: postgres://accord:accord@localhost:5432/accord
          ACCORD_INTEROP_SEEDS: 1,2,3,4,5

  # The committed contract/ must match the Accord repository (golden vectors, protocol schemas).
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crossben/accordsync
          path: accord-src
      - uses: dart-lang/setup-dart@v1
      - run: dart run tool/sync_contract.dart --check
        env:
          ACCORD_APP_DIR: accord-src
