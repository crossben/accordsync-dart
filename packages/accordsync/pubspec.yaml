name: accordsync
description: The Accord client for Dart - local-first writes, background sync, conflicts and refusals. Works in Flutter, CLI tools and servers.
version: 0.3.2
homepage: https://accord.benhattab.pro/docs/client/
repository: https://github.com/crossben/accordsync-dart
topics: [offline-first, sync, crdt, local-first]
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  accordsync_core: ^0.3.2
  http: ^1.6.0

dev_dependencies:
  accordsync_testing: any
  lints: ^6.1.0
  test: ">=1.25.0 <2.0.0"
